<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' width='100%' height='100%'>
  <defs>
    <!-- Deep obsidian base with emerald-teal core -->
    <radialGradient id='baseGlow' cx='65%' cy='25%' r='85%'>
      <stop offset='0%' stop-color='#092c28'/>
      <stop offset='45%' stop-color='#041715'/>
      <stop offset='100%' stop-color='#020908'/>
    </radialGradient>
    
    <radialGradient id='glowCorner' cx='15%' cy='85%' r='65%'>
      <stop offset='0%' stop-color='#0d3d37' stop-opacity='0.6'/>
      <stop offset='60%' stop-color='#041715' stop-opacity='0'/>
    </radialGradient>

    <radialGradient id='bermudaOrb' cx='82%' cy='18%' r='50%'>
      <stop offset='0%' stop-color='#80cbc4' stop-opacity='0.28'/>
      <stop offset='45%' stop-color='#26a69a' stop-opacity='0.12'/>
      <stop offset='100%' stop-color='#041715' stop-opacity='0'/>
    </radialGradient>

    <!-- Mineral grain noise -->
    <filter id='grain' x='0%' y='0%' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.02' numOctaves='3' result='noise'/>
      <feColorMatrix type='matrix' values='
        0 0 0 0 0.50
        0 0 0 0 0.79
        0 0 0 0 0.77
        0 0 0 0.08 0' in='noise' result='coloredNoise'/>
      <feBlend mode='screen' in='SourceGraphic' in2='coloredNoise'/>
    </filter>

    <!-- Soft blur for ambient glows -->
    <filter id='glowBlur' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='30'/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width='100%' height='100%' fill='url(#baseGlow)'/>
  <rect width='100%' height='100%' fill='url(#glowCorner)'/>
  <rect width='100%' height='100%' fill='url(#bermudaOrb)'/>

  <!-- Liquid Marble Veins (Layer 1: Deep Aqua Under-veins) -->
  <g filter='url(#glowBlur)' opacity='0.4'>
    <path d='M-100,200 Q400,100 800,450 T1600,600 T2100,900' fill='none' stroke='#26a69a' stroke-width='45'/>
    <path d='M200,-100 Q600,400 1100,350 T1900,800' fill='none' stroke='#80cbc4' stroke-width='28'/>
    <path d='M-50,700 Q500,650 950,850 T1700,1100' fill='none' stroke='#00796b' stroke-width='38'/>
  </g>

  <!-- Crisp Organic Marble Veins (Layer 2: Detailed Bermuda Veins) -->
  <g opacity='0.5' stroke-linecap='round'>
    <!-- Primary diagonal fissure cluster 1 -->
    <path d='M-50,150 Q250,80 500,260 Q750,440 900,410 Q1100,380 1350,560 Q1550,700 1950,780' fill='none' stroke='#80cbc4' stroke-width='3.2'/>
    <path d='M100,220 Q320,180 540,320 Q700,410 880,390 Q1050,380 1250,510 Q1450,620 1700,670' fill='none' stroke='#b2dfdb' stroke-width='1.8' stroke-dasharray='140, 8, 90, 12'/>
    
    <!-- Secondary tributary branches -->
    <path d='M500,260 Q650,220 850,280 Q1050,340 1200,290' fill='none' stroke='#80cbc4' stroke-width='1.6' opacity='0.75'/>
    <path d='M900,410 Q980,520 1150,640 Q1300,740 1480,790' fill='none' stroke='#4db6ac' stroke-width='2.2'/>
    <path d='M1350,560 Q1420,480 1620,440 Q1800,410 1980,480' fill='none' stroke='#80cbc4' stroke-width='1.8'/>

    <!-- Diagonal fissure cluster 2 (Lower left to bottom right) -->
    <path d='M-100,600 Q300,520 600,710 Q900,890 1250,860 Q1550,840 2050,1050' fill='none' stroke='#80cbc4' stroke-width='3.5'/>
    <path d='M150,630 Q420,580 680,740 Q950,910 1200,890 Q1500,870 1850,1010' fill='none' stroke='#e0f2f1' stroke-width='1.6' opacity='0.85'/>
    <path d='M600,710 Q720,620 920,640 Q1100,660 1300,590' fill='none' stroke='#26a69a' stroke-width='2.0'/>

    <!-- Diagonal fissure cluster 3 (Top right corner) -->
    <path d='M1100,-50 Q1350,120 1550,90 Q1750,70 2000,220' fill='none' stroke='#80cbc4' stroke-width='2.6'/>
    <path d='M1350,120 Q1450,240 1680,290 Q1850,330 2050,310' fill='none' stroke='#b2dfdb' stroke-width='1.5' stroke-dasharray='100, 10, 50, 8'/>
  </g>

  <!-- Fine Mineral Fractures (Layer 3: Hairline cracks) -->
  <g opacity='0.35' stroke-linecap='round'>
    <path d='M300,100 Q450,160 520,240' fill='none' stroke='#ffffff' stroke-width='0.9'/>
    <path d='M880,390 Q940,360 1020,390' fill='none' stroke='#80cbc4' stroke-width='1.0'/>
    <path d='M1250,510 Q1320,580 1400,590' fill='none' stroke='#ffffff' stroke-width='0.8'/>
    <path d='M400,560 Q510,610 580,690' fill='none' stroke='#b2dfdb' stroke-width='1.0'/>
    <path d='M1000,880 Q1120,850 1180,890' fill='none' stroke='#ffffff' stroke-width='0.9'/>
    <path d='M1500,870 Q1620,930 1720,950' fill='none' stroke='#80cbc4' stroke-width='1.1'/>
  </g>

  <!-- Organic Grain Texture Overlay -->
  <rect width='100%' height='100%' fill='url(#baseGlow)' filter='url(#grain)' opacity='0.45' mix-blend-mode='overlay'/>
</svg>